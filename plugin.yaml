name: vellum
version: "0.4.1"
manifest_version: 2
description: "Vellum: Hermes draws inside the paper. Highlight a passage in an arXiv paper in Hermes's browser and your own Hermes explains it out loud while drawing a live figure right under it. Ask more and it keeps building on the same figure."
author: 0xsaltylollipop
homepage: https://github.com/0xsaltylollipop/vellum
license: MIT
tags: [research, papers, visualization, desktop, education]
requires_hermes: ">=0.22.7"
platforms: []
provides_tools: [vellum_draw, vellum_look, vellum_clear, vellum_read]
provides_hooks: [pre_llm_call, pre_tool_call, on_stream_delta, on_stream_end, post_llm_call]
requires_env: []
